# The farm in ShotGrid's right-click menu (README: ShotGrid right-click): which shows have it.
#
#   ComfyFarm Open ▸ <workflow>
#
# Its workflows are those with an image input (worked out from their manifests). After
# changing this file (or adding a workflow), deploy the manager, then make ShotGrid's menu
# match it with tools/sg_ami.py (with a script that may: --pipeline in Maya).

# What ShotGrid's menu posts to: the manager's address as artists' browsers reach it
# (manager.json's). Changing it later means syncing again (the old items are removed).
farm_url: http://wrk1125l.rodeofx.com:9090

# The shows (their tank_name) whose Versions and Playlists have the menu: `all` the
# workflows that fit, or a list of them.
shows:
  raa: all
  bri3: all
  cold: all
  # bri3: [ltx25_alpha_gen]

# Open ticks "Publish when done" for a workflow that publishes (the form and Batch Submit).
publish: true

# The folders. open: the dashboard, filled in. submit / publish (ComfyFarm Submit ▸,
# ComfyFarm Submit + Publish ▸) send a Version straight to the farm; kept off while every
# click opens a new tab anyway (until the manager has https and ShotGrid can show the
# result over its own page, chunk 16).
menus: [open]
