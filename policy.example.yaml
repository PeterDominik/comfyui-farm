# The farm's policy (README: Policy; decisions 0007, 0043). Copy it into the bank folder as
# policy.yaml (share.dir), edit it there, and switch it on with `policy: {enabled: true}` in
# the manager's config.yaml. Check a file before it goes in the bank:
#
#   python -m comfyfarm policy check /path/to/policy.yaml
#
# The manager reads it again when it changes. A file that doesn't validate isn't taken: the
# last valid one stays in force, and GET /api/v1/policy says what's wrong with it.

version: 1

# Who to ask: named in every refusal.
contact: the CG supervisors (#comfyfarm)

# Shows no rule names: allow (the farm is open to every show unless a rule says otherwise)
# or deny (only shows a rule names, and only with what that rule allows).
other_shows: allow

# A job whose show can't be worked out from its input or given: allow or deny.
unknown_show: allow

# Rules, by show. Every rule that names a job's show is checked; the first that refuses the
# job is named to the artist with its reason. A rule either denies (all, or some definitions)
# or allows only some definitions. Shows can be patterns: ret* is every show starting "ret".
shows:
  - name: example-no-ai
    shows: [exmpl2601]
    deny: all
    reason: The client's contract rules out generative AI on this show

  - name: example-alpha-only
    shows: [exmpl2602, exmpl26*]
    allow: [ltx25_alpha_gen, sam3_ltx_alpha]
    reason: Only alpha generation is cleared with the client on this show

  - name: example-no-video-generation
    shows: [exmpl2603]
    deny: [wan22_i2i, ltx25_layout_render]
    reason: The client hasn't cleared generated imagery in the frame

# Rules for the licences of the model weights a definition uses (each definition lists them
# under models: in its process.yaml, with their licence). A rule either denies some licences
# or allows only some; licences are compared without case. `except` leaves out shows that
# `shows` names: shows: ["*"] with except: [rnd*] is every job but R&D's. `check` lists
# which licences each definition carries.
licences:
  - name: example-no-research-only
    shows: [exmpl26*]
    except: [exmpl2699]
    deny: [ubisoft-machine-learning-license-research-only-copyleft]
    reason: Research-only weights can't be used on client work

# A definition that doesn't list its models, on a show a licence rule is for: allow or deny.
unlisted_models: allow

# Quotas: at most max_jobs submissions and/or max_frames frames (tiles, for textures) queued
# or running at once, for the shows a rule names: each show its own count (per: show, the
# default), each user their own, over all those shows (per: user), or the shows together
# (per: all).
# A texture set is one submission, its frames its unfinished batches' tiles. Checked when a
# job is planned, with what is queued then; the preview shows a refusal before submitting.
quotas:
  - name: example-share-of-the-pilot
    shows: [exmpl26*]
    max_jobs: 20
    max_frames: 5000
    reason: The show's share of the pilot's GPUs

  - name: example-two-each
    shows: [exmpl26*]
    per: user
    max_jobs: 2
    reason: Leave room for everyone

# Outside providers (decision 0058): a workflow that runs at one (fal.ai, providers/) sends the
# show's images and prompts outside Rodeo. No show may use one until a rule here allows it,
# and its jobs need a known show; with policy off, none may. A rule either allows some outside
# providers or denies some providers, the farm's own too. Every rule that names a job's show
# is checked, and a deny wins.
providers:
  - name: pilot-fal-on-rnd
    shows: [rnd]
    allow: [fal]
    reason: The fal.ai pilot runs on rnd alone, so no client material reaches the pilot's account

  - name: example-no-python
    shows: [exmpl2604]
    deny: [python-local]
    reason: Only the ComfyUI workflows are cleared on this show

# Budgets (decision 0060): what each show may spend at outside providers, in US dollars, over
# the life of the show. Without this section no show may spend anything. A job that doesn't
# fit in its show's cap is refused before it is queued; once queued, its estimate is held
# against the cap until fal.ai's bill says what it cost. Each show a rule names gets its own
# cap, and the first rule naming a show gives it.
budgets:
  other_shows: 0         # the cap of a show no rule names
  confirm_above: 5       # a job estimated at this or more is queued once the artist says yes
  warn_at: 0.8           # an alert (alerts.budgets) once a show has spent this share of its cap
  rules:
    - name: pilot-rnd
      shows: [rnd]
      cap: 50
      reason: Peter's fal.ai pilot, on his own fal.ai account
