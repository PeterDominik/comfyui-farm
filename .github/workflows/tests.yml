# Runs the test suite on every pull request and on main (docs/decisions/0011).
# Linux is the gate. Windows runs too but does not block a merge until it has been green
# for a while: one pilot machine is Windows, and its deploy scripts are only parsed there.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.12", advisory: false}   # the farm's Python (deploy/comfyui/environment.yaml)
          - {os: windows-latest, python: "3.12", advisory: true}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install the farm's requirements and what only the tests use
        run: python -m pip install --index-url https://pypi.org/simple -r requirements-dev.txt
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -t . -v
