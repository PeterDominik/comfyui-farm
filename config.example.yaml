# The manager's settings. Copy to config.yaml (git ignores it) and edit for this machine.
# The setup scripts (deploy/linux/setup.sh manager, deploy\windows\setup.ps1) do the copy for you.
#
#   python -m comfyfarm standalone   the manager plus an agent for each of `workers:` below,
#                                    in one process (one farm machine; `serve` is the same)
#   python -m comfyfarm manager      the manager only: agents on the GPU machines check in
#                                    (`python -m comfyfarm agent`, settings in agent.yaml)

server:
  host: 0.0.0.0        # listen on the studio network
  port: 8000

database: data/comfyfarm.db
log_dir: logs
workflows_dir: workflows

# standalone: the ComfyUI instances on this machine that run jobs, each with an agent in
# this process. Keep ComfyUI itself on 127.0.0.1 (no --listen); only its agent talks to
# it. `manager` ignores this list: GPU machines run their own agent (agent.example.yaml).
workers:
  - name: rtx5090
    url: http://127.0.0.1:8188
    max_inflight: 2      # one running + one waiting, so the GPU never idles between jobs

# A folder every artist and agent can read. At every start the manager writes its address
# there (manager.json) and copies the Nuke client into it (client/): artists install the
# panel from <dir>/client/nuke, and agents can use <dir>/manager.json as their `manager:`.
share:
  dir: ''              # e.g. /rdo/bank/comfy_farm; empty = none
  url: ''              # the address written there; empty = http://<this machine's name>:<server.port>

# Agents on other machines check in over HTTP (/api/v1/agent/...). They need no open
# port themselves; the manager's port must be reachable from them.
agents:
  token: ''            # shared secret, the same as `token` in each agent.yaml. Empty = any
                       # agent may check in: set one as soon as the manager is on the network
  # A job goes to the best machine that is free, so the biggest GPUs (most VRAM) get jobs
  # first. To put machines first in another order, list their names (agent.yaml `name`),
  # best first; the others follow by VRAM. e.g. [wrk59467w-5090, wrk1125l-3090]
  order: []

paths:
  # Show storage as Linux workstations see it (posix) and as this machine sees it (windows,
  # or local). /shows is the same storage as /rdo/shows: list it after /rdo/shows, so inputs
  # given as /shows/... work too and the farm writes and reports /rdo/shows/... paths.
  #
  # A Linux manager or agent, which sees /rdo/shows as it is:
  #   mappings:
  #     - posix: /rdo/shows
  #     - posix: /shows
  #       local: /rdo/shows
  #
  # A Windows machine, which sees it as the UNC share:
  mappings:
    - posix: /rdo/shows
      windows: //rodeofx.com/smb/shows
    - posix: /shows
      windows: //rodeofx.com/smb/shows

  # Where show / seq / shot sit in an input path. {name} = one folder, so any shot
  # naming works (bpash_1545, 15454_656551, ...). Tried in order; later patterns
  # only fill in what earlier ones didn't find. Shot work areas name the shot folder by
  # its short number, so they capture {shot_short} and the full name is built with
  # shot_name: /rdo/shows/raa/bpash/1545/movhistory/... -> shot bpash_1545.
  # Asset paths give {asset}: texture workflows put their maps in an <asset> folder.
  context_patterns:
    - '/shows/{show}/.published/{seq}/{shot}/'
    - '/shows/{show}/{seq}/{shot_short}/movhistory/'
    - '/shows/{show}/_asset/{asset}/'
    - '/shows/{show}/'
  shot_name: '{seq}_{shot_short}'

  # Where frames go: output_dir inside output_root. The artist's "Output folder"
  # replaces output_root. Each job takes the first {version} not already used in that
  # folder (by files there, or by a queued job), so runs never overwrite each other.
  #   tokens: {root} {show} {seq} {shot} {tag} {version}
  # A studio path (mapped above) or this machine's own path.
  output_root: '/rdo/shows/{show}/_project_ref/_cg/comfyui/renders'
  output_dir: '{root}/{shot}'

  # File names. {source} = input file name without frame number and extension,
  # e.g. bpash_1545.preprocess.mp01_png.v1 -> bpash_1545.preprocess.mp01_png.v1.alpha_v001.1001.png
  #   tokens: {source} {folder} {show} {seq} {shot} {tag} {version} {frame} {ext}
  #   Keep {version} in here: it's what keeps runs in the same folder apart.
  frame_name: '{source}.{tag}_v{version:03d}.{frame:04d}.{ext}'
  preview_name: '{source}.{tag}_v{version:03d}_preview.mp4'

  # Never written into (locked; publishing goes through Tractor).
  no_write_dirs: ['.published']

  # Where artists may point the "Output folder" field. Empty = anywhere under the
  # mappings above (i.e. anywhere on show storage). To narrow it, list real folders:
  #   allowed_output_roots: ['/rdo/shows/raa/_project_ref', '/rdo/shows/xyz/_project_ref']
  allowed_output_roots: []

  validate_inputs: true

convert:
  # EXR sequences and movies are converted to PNG frames by the worker that runs the job,
  # into its scratch folder, before the workflow runs; deleted when the job finishes.
  # These are the standalone agents' settings (several workers: a subfolder each); an agent
  # on another machine has its own convert: in agent.yaml. The manager reads inputs' headers
  # only (sizes, frame ranges, timecode) to plan jobs.
  scratch_dir: data/scratch
  max_parallel_jobs: 1     # conversions at once; they run while the GPU works on other jobs
  frame_workers: 6         # oiiotool processes per EXR job
  keep_failed: false       # keep converted frames of failed jobs for debugging
  # Empty = the venv (oiiotool from OpenImageIO, ffmpeg from imageio-ffmpeg), then PATH.
  # ffprobe is optional: without it, movie info is read with ffmpeg.
  tools: {oiiotool: '', ffmpeg: '', ffprobe: ''}
  exr:
    extra_args: ['--ch', 'R,G,B', '--croptofull']   # before the colour conversion (see ocio:)
    png_compression: 0     # PNG zlib level 0-9: 0 = off (fastest), 6 = OpenImageIO default, 9 = smallest
                           # (also for images scaled to a workflow's work_resolution)
  movie:
    default_start: 1001    # when a movie has no timecode (first frame used after any slate)
    # The first frame of these movies is a slate, not plate, and is dropped. The rest keep
    # their timecode numbers (slate at 1000 -> plate from 1001).
    slate:
      folders: [movhistory]
      extensions: [.mov]

ocio:
  # The farm's OCIO config, kept in the repo (ocio/), so git pull updates it. Its two
  # conversions are a Nuke Write and Read set to "default (color_picking)" in Rodeo's
  # published show config:
  #   EXR inputs (plates, textures) -> 8-bit PNG for ComfyUI:  scene_linear -> color_picking
  #   texture colour maps from ComfyUI -> EXR:                color_picking -> scene_linear
  # `python -m comfyfarm check` checks it against values measured in Nuke (ocio/README.md).
  config: ocio/config.ocio     # relative = inside the repo

textures:
  workers: 6               # oiiotool processes per job when writing the maps

auth:
  # Leave empty to run without keys (artists' user names are taken on trust).
  # To require keys:   api_keys: {"long-random-string": "peter", "another-one": "jane"}
  api_keys: {}
  admins: []           # user names allowed to cancel anyone's job and raise priority

farm:
  max_attempts: 2          # runs of a job before it fails, when a worker loses it (crash, restart)
  lost_after_seconds: 300  # an agent that stops checking in this long has its jobs queued again
  strict_preflight: true   # fail jobs no worker can run (missing node pack, input or model) at once
  # standalone agents only (agent.yaml has its own):
  reconcile_seconds: 20    # jobs cross-checked against ComfyUI's queue and history this often
  health_seconds: 5        # ComfyUI checked this often
  delete_comfy_history: true

# Publishing finished jobs through the pipeline (README, Publishing): a Nuke template staged
# with the job's frames, then Daiquiri's update_and_render_nuke dispatched to Tractor.
publish:
  enabled: false           # true: Publish buttons and "Publish when done" for workflows with publish: in their manifest
  dry_run: true            # every publish is a dispatchGraph --dry-run (checked, nothing sent): start with this
  templates: /rdo/bank/comfy_farm/publishTemplates/Nuke            # <templates>/<workflow>/<name>.nk
                           # and <templates>/_generic/<name>.nk for every workflow; .history/ keeps each version
  default_step: lay        # for workflows whose manifest names no publish step
  staging: /rdo/bank/comfy_farm/publishTemplates/Nuke/.staging     # <staging>/<job id>/<name>.nk
  show_folder: /rdo/shows/{show}  # only shows with this folder are published to (and offered); empty: no check
  keep_days: 14            # staged scripts are removed after this long
  description: Auto Publish            # when the artist leaves it empty
  description_suffix: " (ComfyFarm {job}, {user})"
  read_colorspace: {png: color_picking, exr: rdo}   # the placeholder Reads' colorspace, by extension
  timeout: 600             # seconds dispatchGraph may take
  workers: 2               # publishes dispatched at once
  # steps: [ani, bmm, ..., uv]          # the studio's steps (the default list is built in)
  # The command, in a clean login shell (shell: env -i … /bin/bash -lc). {graph} {show} {shot}
  # {step} {description} {workfile} {frames} {first} {last} {job} {user}, each shell-quoted:
  # command: "source /rdo/rodeo/setup/rdo_rez_launcher/current/env/set_context.sh {show} && /rdo/rodeo/setup/rdo_rez_launcher/current/rdo_rez_launcher.bash -a graph -c dispatchGraph {graph} --description {description} --step {step} --entities {shot} --workfile {workfile} --frameRange {frames}"

# ShotGrid lookups for the publish fields (README, ShotGrid lookups): the active shows and
# each show's sequences and shots as suggestions, and a check that a publish goes to a shot
# that exists. Read only. The script's name and key are never written here: they come from
# the manager's environment or env_file (KEY=value lines, chmod 600).
shotgrid:
  enabled: false
  url: https://rodeofx.shotgrid.autodesk.com/
  script_name_env: SG_SCRIPT_NAME
  script_key_env: SG_SCRIPT_KEY
  env_file: ~/.config/comfyfarm/shotgrid.env
  project_filters: [[sg_status, is, Active]]     # the shows offered
  show_field: tank_name                          # the Project field with the show code (bri3)
  hidden_statuses: [hld, omt, hdn, void]         # shots left out of the lists
  projects_ttl: 900        # seconds a list is used before it's loaded again
  shots_ttl: 600           # (the ↻ buttons reload at once)
