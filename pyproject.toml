[project]
name = "comfyfarm"
version = "0.1.0"
description = "Job queue and REST API in front of ComfyUI workers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=13",
    "pyyaml>=6",
    "OpenImageIO>=3.0",
    "imageio-ffmpeg>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
