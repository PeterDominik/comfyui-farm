# What this environment is, and the command that tells a good build of it: run in the build
# ("python" is the build's own), it must exit 0 (docs/decisions/0024).
description: >
  torch with CUDA, numpy and pillow: the farm's test process (phase 3) runs in it.
check:
  - python
  - -c
  - >-
    import torch, numpy, PIL;
    assert torch.cuda.is_available(), 'torch sees no GPU: check the NVIDIA driver';
    print('torch', torch.__version__, 'on', torch.cuda.get_device_name(0))
