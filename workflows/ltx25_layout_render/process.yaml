# What the farm exposes for this workflow and what it writes (the head), and which ComfyUI
# nodes do each (runner:). Full reference: "process.yaml" and "Workflow manifests" in README.md.
#
# Every node is named with its class_type too, so a re-export that renumbers nodes fails
# `python -m comfyfarm check` instead of writing into the wrong node.

id: ltx25_layout_render
label: LTX 2.5 layout to render
description: >
  Renders a layout (or blockout) sequence with the LTX 2.5 IC-LoRA layout-to-render
  model in two stages (544 on the shorter side, then upscaled 2×), guided by the prompt
  and a reference frame for the look. Outputs a PNG sequence numbered like the layout.
tag: render                     # in the output file names: <source>.render_vNNN.<frame>.png
task: video                     # in the menus: Provider > Task > Workflow (workflows/tasks.yaml)
# The least GPU memory a machine needs (GB, as the card is sold): LTX 2.5 22B runs on the
# 32 GB 5090 and up, so the 24 GB 3090 never gets it.
requires: {vram_gb: 32}
# Published through Daiquiri's update_and_render_nuke (README: Publishing), with a template
# from /rdo/bank/comfy_farm/publishTemplates/Nuke/ltx25_layout_render/; to the farm's step
# (publish.default_step, ai) unless the artist picks another. publish: {step: <step>} here
# would offer another first.
# Inputs are used at their own size: the workflow scales the layout to 544 on its shorter
# side itself. 24 fps, seed 42 and the sampler settings are fixed in the workflow.

# The weights it loads and their licence (decisions 0044, 0070). LTX-2.x's community licence
# needs a paid licence from Lightricks for a company of Rodeo's size, which Rodeo doesn't hold,
# so the farm's policy refuses it on every show (Peter, 26 November 2026). The Gemma 4 text
# encoder comes with LTX's projection, so it is LTX's.
models:
  - {file: ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors, licence: ltx-2-community-license}
  - {file: ltx-2.5-video-vae-bf16.safetensors, licence: ltx-2-community-license}
  - {file: ltx-2.5-audio-vae-bf16.safetensors, licence: ltx-2-community-license}
  - {file: ltx-2.5-latent-spatial-upscaler-x2-bf16-1.0.safetensors, licence: ltx-2-community-license}
  - {file: LTX/ltx-2.5-22b-ic-lora-layout-to-render-1.0.safetensors, licence: ltx-2-community-license}
  - {file: gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors, licence: ltx-2-community-license}

params:
  # Two inputs. The layout is primary: it names the outputs and numbers their frames.
  input:
    type: input
    takes: images
    primary: true
    label: Layout sequence
    required: true
    help: >
      The layout to render: an image sequence with frame pattern and range, e.g.
      /rdo/shows/<show>/.../<shot>.layout.%04d.png 1001-1097, or a .mov/.mp4 (numbered from
      its timecode). EXRs are converted with the shot's OCIO look first.

  reference:
    type: input
    takes: image
    label: Reference frame
    required: true
    help: >
      One image for the look: a file, or a sequence or movie with the frame to use after
      it, e.g. /rdo/shows/<show>/.../<shot>.comp.%04d.exr 1050. In Nuke, "From selected"
      takes the selected Read node at the current frame.

  prompt:
    type: text
    label: Prompt
    required: true
    help: What the shot should look like.

  negative:
    type: text
    label: Negative prompt
    default: ''

  output_path:
    type: output_folder
    label: Output folder
    help: >
      Frames go into a folder named after the shot inside this one, as
      <source>.render_vNNN.<frame>.png. Each run takes the next free version. Its parent
      folder must exist. Leave empty for the show's renders folder. Never inside .published.

writes:
  # The frames, renamed to paths.frame_name with the layout's frame numbers.
  frames: {ext: png}

runner:
  type: comfyui
  template: workflow_api.json

  params:
    input:
      loader: {node: "9061", class: ComfyFarmLoadImages}               # INPUT IMAGE SEQUENCE
    reference:
      loader: {node: "9060", class: ComfyFarmLoadImage}                # INPUT Reference Frame
    prompt:
      targets:
        - {node: "5508", input: value, class: PrimitiveStringMultiline}  # Prompt (positive)
    negative:
      targets:
        - {node: "5509", input: value, class: PrimitiveStringMultiline}  # Prompt (negative)

  outputs:
    # Writes the frames. The farm points it at the job's folder, then renames them.
    frames: {node: "9065", class: ComfyFarmSaveImage, path_input: output_path, prefix_input: filename_prefix}
