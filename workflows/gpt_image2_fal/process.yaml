# Drafted by `comfyfarm fal draft openai/gpt-image-2` (decision 0065), by Peter against fal.ai
# itself on 27 November 2026, then reviewed the same day against fal.ai's page for the model:
# its price, what the artist may set, its licence and its menu.
#
# An API definition (decisions 0055, 0056): the job runs at fal.ai, sent by the farm's
# gateway, never on a farm GPU. Full reference: "API definitions and the gateway" in README.md.
# The gateway sends it to fal.ai itself, which charges for it, only with providers.fal.live:
# true in gateway.yaml (decision 0062); otherwise to the stand-in (tools/mock_fal.py).
#
# No input image (decision 0068): the Output folder says which show the job is for (its policy
# and its cap), and the result is named after the folder's shot, else its show.

id: gpt_image2_fal
label: GPT Image 2
description: >
  Makes one image from a prompt, with OpenAI's GPT Image 2 at fal.ai: very detailed, good at
  text in the picture and at following a long prompt, up to 3840 x 2160, with a transparent
  background if asked. The result is a PNG, frame 1001, in the Output folder. The prompt leaves
  Rodeo's network: it is sent to fal.ai, which keeps neither the job nor its result in its
  request history.
tag: gptimage2                  # in the output file names: <shot>.gptimage2_vNNN.1001.png
task: image                     # in the menus: fal.ai > Image > GPT Image 2
provider: fal                   # providers/fal.yaml: off-site, through the gateway
family: gpt-image-2             # the same model at other providers, for comparing prices (later)
class: interactive
limits: {max_minutes: 10}       # at fal.ai, queue included; then it is cancelled there
# No model weights on the farm: the model is OpenAI's, run by fal.ai, with fal.ai's licence
# type for it: its use through the API is licensed (decision 0070).
models: [{file: openai/gpt-image-2, licence: fal-commercial}]
# What a job costs (decisions 0059, 0071). fal.ai bills it by the token: $30 a million output
# image tokens and $5 a million prompt tokens (its page, 27 November 2026). Its pricing API says
# "$1 a unit", which prices no job, so the estimate is this reviewed price, not fal.ai's that
# day. A high-quality 1024 x 1024 is 7,024 image tokens ($0.21); the factors take a size's
# tokens in proportion to its area, which a larger image doesn't go over. Medium and low cost
# far less, and are held at the high price: fal.ai's bill settles what it was (decision 0061).
cost:
  unit: image
  price: 0.22
  quantity: 1                   # num_images, fixed below
  provider_price: false
  by:
    param: size
    factors: {"1024 x 1024 (1:1)": 1, "1536 x 1024 (3:2)": 1.5, "2048 x 864 (2.37:1)": 1.7,
              "2048 x 1152 (16:9)": 2.25, "2048 x 2048 (1:1)": 4, "3840 x 2160 (16:9)": 8}
publish: false                  # not published through the pipeline during the pilot
shotgrid: false                 # no input for a ShotGrid Version

params:
  prompt:
    type: text
    label: Prompt
    required: true
    help: >
      What to make, in plain words: the subject, the framing, the light, any text to write in
      the picture. GPT Image 2 follows a long, precise prompt closely.

  size:
    type: choice
    label: Size
    choices: ["1024 x 1024 (1:1)", "1536 x 1024 (3:2)", "2048 x 864 (2.37:1)", "2048 x 1152 (16:9)",
              "2048 x 2048 (1:1)", "3840 x 2160 (16:9)"]
    default: "2048 x 1152 (16:9)"
    help: >
      The result's width and height in pixels. fal.ai bills by the token, and a larger image
      takes more: about $0.21 at 1024 x 1024 in high quality, up to about $1.70 at 3840 x 2160.

  quality:
    type: choice
    label: Quality
    choices: [low, medium, high]
    default: high
    help: >
      High for finished images. Medium costs about a quarter of high and low about a
      thirtieth, for trying prompts out. The estimate always holds the high price; fal.ai's
      bill says what it was.

  background:
    type: choice
    label: Background
    choices: [auto, opaque, transparent]
    default: auto
    help: >
      Transparent gives a PNG with an alpha channel, for an element to comp over a plate.
      Auto lets the model choose.

  output_path:
    type: output_folder
    label: Output folder
    required: true
    help: >
      Where the result goes, on show storage, e.g.
      /rdo/shows/<show>/_project_ref/_cg/comfyui/renders: with no input image, it says which
      show the job is for. It is named after the folder's shot, else its show, as
      <shot>.gptimage2_vNNN.1001.png. Each run takes the next free version. Never inside
      .published.

writes:
  frames: {ext: png}

runner:
  type: api
  endpoint: openai/gpt-image-2
  upload: {}
  send: {prompt: prompt, size: image_size, quality: quality, background: background}
  # What each size sends as fal.ai's image_size (decision 0069): its width and height, each a
  # multiple of 16, the longer edge 3840 at most, within fal.ai's limits for the model.
  values:
    size:
      "1024 x 1024 (1:1)": {width: 1024, height: 1024}
      "1536 x 1024 (3:2)": {width: 1536, height: 1024}
      "2048 x 864 (2.37:1)": {width: 2048, height: 864}
      "2048 x 1152 (16:9)": {width: 2048, height: 1152}
      "2048 x 2048 (1:1)": {width: 2048, height: 2048}
      "3840 x 2160 (16:9)": {width: 3840, height: 2160}
  # Left to fal.ai's defaults: output_compression (a JPEG's) and enable_safety_checker. Never
  # the artist's: one image a job, a PNG (writes.frames.ext), and the result in fal.ai's answer
  # itself (sync_mode), so it is never a file on fal.ai's CDN, nor kept in the account's request
  # history (decision 0062).
  fixed:
    num_images: 1
    output_format: png
    sync_mode: true
