# What the farm exposes for this workflow, and which nodes each parameter drives.
# Full reference: "Workflow manifests" in README.md.
#
# Every target names the node id AND its class_type, so a re-export that renumbers nodes
# fails `python -m comfyfarm check` instead of writing into the wrong node.

name: wan22_i2i
label: Wan 2.2 image to image
description: >
  Reworks one image with Wan 2.2 14B (low-noise model, fp8), steered by the prompt. Noise
  sets how far it may move from the input: low values keep it close. Takes a still, or
  one frame of a sequence or movie; the result is a PNG numbered like that frame, at the
  input's size.
tag: i2i                        # in the output file names: <source>.i2i_vNNN.<frame>.png
template: workflow_api.json
# Images are used at their own size (no work_resolution): full plate frames take longer
# and more GPU memory.

params:
  # One image (takes: image), read by the ComfyFarm Load Image node (INPUT IMAGE). A
  # sequence or movie must name its frame; the Nuke panel fills in the current frame.
  input:
    type: input
    takes: image
    label: Input image
    required: true
    loader: {node: "254", class: ComfyFarmLoadImage}
    help: >
      One image: a file, or a sequence or movie with the frame to use after it, e.g.
      /rdo/shows/<show>/.../<shot>.plate.%04d.exr 1050. EXRs are converted with the shot's
      OCIO look first; movies are numbered from their timecode. In Nuke, "From selected"
      takes the selected Read node at the current frame.

  prompt:
    type: text
    label: Prompt
    default: ''
    help: What the image should become. Leave empty to run with the negative prompt only.
    targets:
      - {node: "255", input: value, class: PrimitiveStringMultiline}   # INPUT PROMPT

  steps:
    type: int
    label: Steps
    default: 12
    min: 1
    max: 100
    targets:
      - {node: "208", input: value, class: PrimitiveInt}               # INPUT STEPS

  cfg:
    type: float
    label: CFG
    default: 3
    min: 0
    max: 30
    targets:
      - {node: "257", input: value, class: PrimitiveFloat}             # INPUT CFG

  noise:
    type: float
    label: Noise
    default: 0.18
    min: 0
    max: 1
    help: The sampler's denoise. 0 keeps the input as it is, 1 replaces it entirely.
    targets:
      - {node: "210", input: value, class: "easy float"}               # INPUT NOISE

  output_path:
    type: output_folder
    label: Output folder
    help: >
      The image goes into a folder named after the shot inside this one, as
      <source>.i2i_vNNN.<frame>.png. Each run takes the next free version. Its parent folder
      must exist. Leave empty for the show's renders folder. Never inside .published.

outputs:
  # Writes the image. The farm points it at the job's folder, then renames it to
  # paths.frame_name with the input's frame number.
  frames: {node: "256", class: ComfyFarmSaveImage, path_input: output_path, prefix_input: filename_prefix, ext: png}
