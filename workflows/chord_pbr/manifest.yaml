# What the gateway exposes for this workflow, and which nodes each parameter drives.
# Full reference: "Workflow manifests" and "Texture workflows" in README.md.
#
# Every node is named with its class_type too, so a re-export that renumbers nodes fails
# `python -m comfyfarm check` instead of writing into the wrong node.

name: chord_pbr
label: CHORD PBR maps from a diffuse texture
description: >
  Ubisoft's CHORD estimates base colour, normal, height, roughness and metalness from a
  diffuse texture or its UDIM tiles. The maps are written as linear EXRs named by the TEX
  naming convention, e.g. acescg_map1_noTile_defState_color01.1001.0000.exr, into a new
  versioned folder for each run.
tag: chord                      # in the output folder name: <source>.chord_v001
template: workflow_api.json
# CHORD runs its model at 1024×1024 anyway, so larger textures are scaled down (longer
# side, aspect kept) before the workflow: less to convert, load and resize, and the maps
# come out at 1024. Textures of 1024 or less are used as they are. Leave out to keep
# the input's size (the maps then come back at it, with 1024 worth of detail).
work_resolution: 1024

params:
  input:
    type: sequence
    label: Diffuse texture
    required: true
    help: >
      A texture file, its UDIM tiles (/rdo/shows/<show>/.../rock_diffuse.%04d.png, gaps are
      fine), or a folder holding one texture. png, jpg, tif, or exr (converted to
      color_picking first, like any EXR). Larger than 1024 px: scaled to 1024 first, as
      CHORD works at 1024. One texture per job.

  output_path:
    type: output_folder
    label: Output folder
    help: >
      Maps go into <asset or shot>/<source>.chord_vNNN/ inside this folder; each run takes the
      next free version. Its parent folder must exist. Leave empty for the show's renders folder.
      Never inside .published.

  # Naming params: they only go into the file names, so they have no targets.
  uvset:
    type: string
    label: UV set
    default: map1
    naming: true
    pattern: '^map\d{1,2}(-[A-Za-z][A-Za-z0-9]*)?$'
    invalid: map plus 1 or 2 digits (map1, map10), optionally -oneWord (map10-preview).

  tile:
    type: choice
    label: Tile
    choices: [auto, tile, noTile]
    default: noTile
    naming: true
    help: auto = noTile for UDIM tiles, tile for a single tileable texture (always UDIM 1001).

  state:
    type: string
    label: State
    default: defState
    naming: true
    pattern: '^[A-Za-z][A-Za-z0-9]*$'
    invalid: one word, camelCase allowed (defState, damaged, burnedFace).

  description:
    type: string
    label: Channel description (optional)
    default: ''
    naming: true
    pattern: '^[A-Za-z][A-Za-z0-9]*$'
    invalid: one word, camelCase allowed. It goes after the channel (color01-sand) and is not techchecked.

  numbering:
    type: choice
    label: Numbering
    choices: [udim, frame]
    default: udim
    naming: true
    help: What the number in the input file names is. frame = an animated texture (UDIM 1001, frame from the name).

# How the 'sequence' parameter is wired in.
sequence:
  path_node: {node: "14", input: value, class: PrimitiveString}    # INPUT_PATH, informational
  loader: {node: "17", class: VHS_LoadImagesPath}                  # directory/skip/cap set directly

outputs:
  root_node: {node: "23", input: value, class: PrimitiveString}    # OUTPUT_PATH, informational

# The maps. Each save node (ComfyFarm Save Image, from comfyui_nodes/ in this repo) writes
# uncompressed PNGs into the job's scratch folder; the gateway converts
# them to EXR with oiiotool and names them. color: true maps go color_picking ->
# scene_linear (ocio/config.ocio); the others keep their values.
# ChordMaterialEstimation outputs basecolor, normal, roughness, metalness;
# ChordNormalToHeight turns the normal into height.
# bmp01/nrm01 are reserved for modeling's published maps, hence bmp02/nrm02.
textures:
  name: '{colorspace}_{uvset}_{tile}_{state}_{channel}{description}.{udim:04d}.{frame:04d}.exr'
  path_input: output_path
  prefix_input: filename_prefix
  ext: png
  # Tiles per run. A texture with more tiles is a set: one output folder, filled by runs of
  # up to this many tiles. CHORD estimates a whole batch in one pass, so GPU memory grows
  # with it: 5 tiles used about 29 GB of the 5090's 32. Measured on the farm (4K EXR
  # tiles at work_resolution 1024): 1 tile 5 s, 2 tiles 8 s, 3 tiles 11 s, 4 tiles 15 s,
  # 5 tiles 18 s. About 2 s per run plus 3.3 s per tile, so 4 is 3.75 s a tile with room
  # to spare.
  batch: 4
  maps:
    - {name: basecolor, node: "19", class: ComfyFarmSaveImage, channel: color01, color: true, bits: half}
    - {name: normal,    node: "24", class: ComfyFarmSaveImage, channel: nrm02,   bits: half}
    - {name: height,    node: "28", class: ComfyFarmSaveImage, channel: bmp02,   bits: float}
    - {name: roughness, node: "31", class: ComfyFarmSaveImage, channel: spcr01,  bits: half}
    - {name: metalness, node: "32", class: ComfyFarmSaveImage, channel: metal01, bits: half}
