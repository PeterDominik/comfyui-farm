<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyUI farm</title>
<style>
  :root {
    --bg: #15171a; --panel: #1d2024; --panel2: #24282d; --line: #31363c; --text: #d9dde2;
    --muted: #8b939c; --accent: #e0a24a; --ok: #5fb878; --bad: #e0675b; --run: #5aa3e0; --wait: #a58ad8;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  .workers { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--bad); vertical-align: 1px; }
  .dot.on { background: var(--ok); }
  .ident { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  main { padding: 16px 20px; display: grid; gap: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .sechead { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .sechead h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; flex: 1; }
  input, select, textarea, button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  textarea { width: 100%; min-height: 54px; resize: vertical; }
  button { cursor: pointer; padding: 5px 12px; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
  button.small { padding: 2px 8px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: default; }
  form { padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; align-items: start; }
  form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  form label.wide { grid-column: 1 / -1; }
  form label.check { display: flex; align-items: center; gap: 8px; padding-top: 24px; }
  form .help { font-size: 11px; color: var(--muted); }
  form .actions { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; }
  .msg { font-size: 13px; }
  .msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--panel2); color: var(--text); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: #22262b; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .s-queued { background: #3a3346; color: #cdbdf0; } .s-dispatched { background: #2f3540; color: #b8c6d8; }
  .s-running, .s-postprocessing { background: #1f3346; color: #9fcdf2; } .s-done { background: #1f3a29; color: #93d6a6; }
  .s-failed { background: #45231f; color: #f0a59c; } .s-cancelled { background: #33363a; color: #a3a9b0; }
  .bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; min-width: 120px; }
  .bar i { display: block; height: 100%; background: var(--run); transition: width .4s; }
  .stage { font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .muted { color: var(--muted); }
  .detail td { background: #191b1e; padding: 14px 18px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 14px; align-items: start; }
  .kv div:nth-child(odd) { color: var(--muted); font-size: 12px; padding-top: 2px; }
  .path { display: flex; gap: 8px; align-items: center; }
  .path code { font-family: var(--mono); font-size: 12px; word-break: break-all; }
  pre { background: #121417; border: 1px solid var(--line); border-radius: 5px; padding: 10px; max-height: 260px; overflow: auto; font-size: 11px; white-space: pre-wrap; }
  video { max-width: 520px; width: 100%; border-radius: 5px; border: 1px solid var(--line); background: #000; }
  .warn { color: var(--accent); } .err { color: var(--bad); }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>ComfyUI <span>farm</span></h1>
  <div class="workers" id="workers"></div>
  <div class="ident">
    <span id="live" class="chip"><span class="dot"></span>connecting</span>
    <label id="userBox">user <input id="user" size="12" placeholder="your login"></label>
    <label id="keyBox" hidden>API key <input id="key" type="password" size="16"></label>
  </div>
</header>

<main>
  <section>
    <div class="sechead">
      <h2>New job</h2>
      <select id="wfSelect"></select>
    </div>
    <form id="form" autocomplete="off"></form>
  </section>

  <section>
    <div class="sechead">
      <h2>Jobs</h2>
      <div class="seg" id="scope"><button data-v="mine">Mine</button><button data-v="all" class="on">Everyone</button></div>
      <div class="seg" id="filter"><button data-v="active" class="on">Active</button><button data-v="finished">Finished</button><button data-v="all">All</button></div>
    </div>
    <table>
      <thead><tr><th>Job</th><th>Shot / name</th><th>User</th><th>Status</th><th>Progress</th><th>Wait</th><th>Submitted</th><th>Took</th><th></th></tr></thead>
      <tbody id="jobs"></tbody>
    </table>
  </section>
</main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const state = { jobs: new Map(), workers: new Map(), workflows: [], auth: false, open: new Set(),
                scope: "all", filter: "active" };

$("#user").value = store.get("comfyfarm.user");
$("#key").value = store.get("comfyfarm.key");
$("#user").onchange = e => { store.set("comfyfarm.user", e.target.value.trim()); render(); };
$("#key").onchange = e => { store.set("comfyfarm.key", e.target.value.trim()); boot(); };

function headers(json) {
  const h = {};
  if (json) h["Content-Type"] = "application/json";
  const u = $("#user").value.trim(), k = $("#key").value.trim();
  if (u) h["X-User"] = u;
  if (k) h["X-API-Key"] = k;
  return h;
}
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...headers(!!opts.body), ...(opts.headers || {}) } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail ? (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail)) : r.statusText);
  return body;
}

// ------------------------------------------------------------- formatting
const ago = t => { if (!t) return ""; const s = Date.now() / 1000 - t;
  if (s < 60) return "just now"; if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago"; return new Date(t * 1000).toLocaleDateString(); };
const dur = s => { if (s == null) return ""; s = Math.round(s); if (s < 60) return s + "s";
  const m = Math.floor(s / 60); return m < 60 ? `${m}m ${s % 60}s` : `${Math.floor(m / 60)}h ${m % 60}m`; };
const gb = b => b ? (b / 1e9).toFixed(1) + " GB" : "?";

// ------------------------------------------------------------- workers
function renderWorkers() {
  $("#workers").innerHTML = [...state.workers.values()].map(w => `
    <span class="chip" title="${esc(w.error || w.url)}${w.problems && Object.keys(w.problems).length ? " — preflight problems, see logs" : ""}">
      <span class="dot ${w.online && w.connected ? "on" : ""}"></span><b>${esc(w.name)}</b>
      ${w.gpu ? " · " + esc(w.gpu.name) + " · " + gb(w.gpu.vram_free) + " free" : ""}
      · ${w.inflight}/${w.max_inflight} slots
      ${Object.keys(w.problems || {}).length ? ' · <span class="err">preflight</span>' : ""}
    </span>`).join("") || '<span class="chip">no workers configured</span>';
}

// ------------------------------------------------------------- submit form
function renderForm() {
  const wf = state.workflows.find(w => w.name === $("#wfSelect").value) || state.workflows[0];
  const f = $("#form");
  if (!wf) { f.innerHTML = '<div class="empty">No workflows loaded.</div>'; return; }
  const field = p => {
    const id = "p_" + p.name, help = p.help ? `<span class="help">${esc(p.help)}</span>` : "";
    const saved = store.get("comfyfarm.last." + wf.name + "." + p.name);
    // Paths are never pre-filled from last time: a remembered folder from another show
    // would quietly send renders to the wrong place.
    const perJob = p.type === "sequence" || p.type === "output_folder";
    const val = perJob ? "" : (saved || (p.default ?? ""));
    if (p.type === "bool")
      return `<label class="check"><input type="checkbox" id="${id}" ${(saved ? saved === "true" : p.default) ? "checked" : ""}> ${esc(p.label)}</label>`;
    if (p.type === "choice")
      return `<label>${esc(p.label)}<select id="${id}">${p.choices.map(c => `<option ${c == val ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>${help}</label>`;
    if (p.type === "text")
      return `<label class="wide">${esc(p.label)}<textarea id="${id}">${esc(val)}</textarea>${help}</label>`;
    if (p.type === "int" || p.type === "float")
      return `<label>${esc(p.label)}<input type="number" id="${id}" value="${esc(val)}" ${p.min != null ? `min="${p.min}"` : ""} ${p.max != null ? `max="${p.max}"` : ""} step="${p.multiple_of || (p.type === "int" ? 1 : "any")}">${help}</label>`;
    const ph = p.placeholder || (p.type === "sequence" ? "/rdo/shows/…/shot.step.%04d.png 1001-1100" : "");
    return `<label class="wide">${esc(p.label)}${p.required ? " *" : ""}<input id="${id}" class="mono" value="${esc(val)}" placeholder="${esc(ph)}">${help}</label>`;
  };
  f.innerHTML = (wf.enabled ? "" : `<div class="msg err" style="grid-column:1/-1">Workflow disabled: ${esc(wf.problems.join("; "))}</div>`)
    + (Object.keys(wf.worker_problems || {}).length ? `<div class="msg err" style="grid-column:1/-1">Preflight: ${esc(Object.entries(wf.worker_problems).map(([w, p]) => w + ": " + p.join("; ")).join(" | "))}</div>` : "")
    + `<div class="help" style="grid-column:1/-1">${esc(wf.description)}</div>`
    + wf.params.map(field).join("")
    + `<label>Job name (optional)<input id="jobname" placeholder="defaults to the shot"></label>
       <div class="actions"><button class="primary" type="submit">Submit</button><span class="msg" id="formMsg"></span></div>`;
  f.onsubmit = async e => {
    e.preventDefault();
    const params = {};
    for (const p of wf.params) {
      const el = $("#p_" + p.name);
      let v = p.type === "bool" ? el.checked : el.value;
      if ((p.type === "int" || p.type === "float") && v !== "") v = Number(v);
      if (v !== "" && v != null) params[p.name] = v;
      if (p.type !== "sequence" && p.type !== "output_folder") store.set("comfyfarm.last." + wf.name + "." + p.name, String(v));
    }
    const msg = $("#formMsg");
    if (!state.auth && !$("#user").value.trim()) { msg.className = "msg err"; msg.textContent = "Enter your user name (top right) first."; return; }
    msg.className = "msg"; msg.textContent = "Checking input…";
    f.querySelector("button[type=submit]").disabled = true;
    try {
      const job = await api("/api/v1/jobs", { method: "POST", body: JSON.stringify({ workflow: wf.name, params, name: $("#jobname").value.trim() || null }) });
      upsert(job); state.open.add(job.id); render();
      msg.className = "msg ok"; msg.textContent = `Queued ${job.short_id} → ${job.info.output_dir_posix || job.info.output_dir}`;
      $("#p_" + wf.params.find(p => p.type === "sequence")?.name)?.select();
    } catch (err) { msg.className = "msg err"; msg.textContent = err.message; }
    finally { f.querySelector("button[type=submit]").disabled = false; }
  };
}

// ------------------------------------------------------------- jobs table
function upsert(job) { const old = state.jobs.get(job.id); state.jobs.set(job.id, old ? { ...old, ...job } : job); }

function visible() {
  const me = $("#user").value.trim();
  return [...state.jobs.values()].filter(j => {
    if (state.scope === "mine" && me && j.user !== me) return false;
    const fin = ["done", "failed", "cancelled"].includes(j.status);
    return state.filter === "all" || (state.filter === "active" ? !fin : fin);
  }).sort((a, b) => b.created_at - a.created_at);
}

function pathRow(label, path) {
  return path ? `<div>${label}</div><div class="path"><code>${esc(path)}</code><button class="small" data-copy="${esc(path)}">copy</button></div>` : "";
}

function detail(j) {
  const i = j.info || {}, o = j.outputs || {}, inp = i.input || {};
  const keyq = $("#key").value.trim() ? "?key=" + encodeURIComponent($("#key").value.trim()) : "";
  return `<tr class="detail"><td colspan="9"><div class="kv">
    <div>Workflow</div><div>${esc(j.workflow)} · seed ${esc(j.params?.seed ?? "")} · ${esc(j.worker || "not dispatched")}${j.attempts > 1 ? ` · attempt ${j.attempts}` : ""}</div>
    ${pathRow("Input", i.input_posix ? i.input_posix + (inp.first != null ? ` ${inp.first}-${inp.last}` : "") : inp.farm_path)}
    <div>Frames in</div><div>${inp.frame_count ?? "?"}${inp.skip || inp.cap ? ` <span class="muted">(loader skip ${inp.skip}, cap ${inp.cap})</span>` : ""}</div>
    ${pathRow("Output", o.frame_pattern_posix || i.output_dir_posix || i.output_dir)}
    ${o.frames ? `<div>Frames out</div><div>${o.frames} (${o.first}-${o.last})</div>` : ""}
    ${pathRow("Output (Windows)", o.frame_pattern || i.output_dir)}
    ${j.params?.positive_prompt ? `<div>Prompt</div><div>${esc(j.params.positive_prompt)}</div>` : ""}
    ${(j.warnings || []).map(w => `<div>Warning</div><div class="warn">${esc(w)}</div>`).join("")}
    ${j.error ? `<div>Error</div><div class="err">${esc(j.error)}</div>` : ""}
    ${i.traceback ? `<div></div><div><details><summary>traceback</summary><pre>${esc(i.traceback)}</pre></details></div>` : ""}
    ${o.preview ? `<div>Preview</div><div class="vslot" data-vid="${j.id}" data-src="/api/v1/jobs/${j.id}/preview${keyq}"></div>` : ""}
    <div></div><div style="display:flex;gap:8px">
      ${["queued", "dispatched", "running"].includes(j.status) ? `<button class="small" data-cancel="${j.id}">Cancel</button>` : ""}
      ${["done", "failed", "cancelled"].includes(j.status) ? `<button class="small" data-retry="${j.id}">Run again</button>` : ""}
      <button class="small" data-prompt="${j.id}">API JSON</button>
    </div></div></td></tr>`;
}

function render() {
  const rows = visible();
  $("#jobs").innerHTML = rows.length ? rows.map(j => {
    const took = j.finished_at && (j.started_at || j.dispatched_at) ? dur(j.finished_at - (j.started_at || j.dispatched_at))
               : j.started_at ? dur(Date.now() / 1000 - j.started_at) : "";
    const wait = j.status === "queued" ? `#${j.queue_position ?? "?"}${j.eta_seconds != null ? " · ~" + dur(j.eta_seconds) : ""}`
               : (j.eta_seconds != null && j.status !== "done" ? "~" + dur(j.eta_seconds) + " left" : "");
    const pct = Math.round((j.progress || 0) * 100);
    return `<tr class="row" data-id="${j.id}">
      <td class="mono">${esc(j.short_id)}</td>
      <td>${esc(j.name)}${j.info?.version ? ` <span class="muted">v${String(j.info.version).padStart(3, "0")}</span>` : ""}</td>
      <td>${esc(j.user)}</td>
      <td><span class="badge s-${esc(j.status)}">${esc(j.status)}</span></td>
      <td>${["running", "postprocessing", "dispatched"].includes(j.status) || j.status === "done"
             ? `<div class="bar"><i style="width:${pct}%"></i></div><div class="stage">${esc(j.stage || "")} ${pct}%</div>`
             : `<div class="stage ${j.status === "failed" ? "err" : ""}">${esc(j.status === "failed" ? j.error : (j.stage || ""))}</div>`}</td>
      <td class="muted">${esc(wait)}</td>
      <td class="muted" title="${new Date(j.created_at * 1000).toLocaleString()}">${ago(j.created_at)}</td>
      <td class="muted">${took}</td>
      <td>${(j.warnings || []).length ? '<span class="warn" title="has warnings">!</span>' : ""}</td>
    </tr>${state.open.has(j.id) ? detail(j) : ""}`;
  }).join("") : `<tr><td colspan="9" class="empty">No ${state.filter === "all" ? "" : state.filter} jobs.</td></tr>`;
  // Re-attach the same <video> elements so playback survives live updates.
  document.querySelectorAll(".vslot").forEach(slot => {
    let v = videos.get(slot.dataset.vid);
    if (!v) {
      v = Object.assign(document.createElement("video"), { controls: true, loop: true, muted: true, preload: "metadata", src: slot.dataset.src });
      videos.set(slot.dataset.vid, v);
    }
    slot.appendChild(v);
  });
}
const videos = new Map();

$("#jobs").addEventListener("click", async e => {
  const t = e.target;
  try {
    if (t.dataset.copy) { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = "copied"; setTimeout(() => t.textContent = "copy", 1200); return; }
    if (t.dataset.cancel) { t.disabled = true; upsert(await api(`/api/v1/jobs/${t.dataset.cancel}`, { method: "DELETE" })); render(); return; }
    if (t.dataset.retry) { const j = await api(`/api/v1/jobs/${t.dataset.retry}/retry`, { method: "POST" }); upsert(j); state.open.add(j.id); render(); return; }
    if (t.dataset.prompt) {
      const data = await api(`/api/v1/jobs/${t.dataset.prompt}/prompt`);
      const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" })), download: t.dataset.prompt.slice(0, 8) + "_api.json" });
      a.click(); return;
    }
  } catch (err) { alert(err.message); return; }
  const row = t.closest("tr.row");
  if (row && !t.closest("button")) { const id = row.dataset.id; state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); }
});

for (const [id, key] of [["#scope", "scope"], ["#filter", "filter"]]) {
  $(id).addEventListener("click", e => {
    if (!e.target.dataset.v) return;
    state[key] = e.target.dataset.v;
    $(id).querySelectorAll("button").forEach(b => b.classList.toggle("on", b === e.target));
    if (key === "filter" && state.filter !== "active") refreshJobs();
    render();
  });
}

// ------------------------------------------------------------- live updates
let ws, wsTimer;
function connect() {
  clearTimeout(wsTimer);
  const k = $("#key").value.trim();
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/v1/events${k ? "?key=" + encodeURIComponent(k) : ""}`);
  ws.onopen = () => $("#live").innerHTML = '<span class="dot on"></span>live';
  ws.onclose = () => { $("#live").innerHTML = '<span class="dot"></span>reconnecting'; wsTimer = setTimeout(connect, 3000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === "snapshot") { m.jobs.forEach(upsert); m.workers.forEach(w => state.workers.set(w.name, w)); renderWorkers(); }
    else if (m.type === "job") upsert(m.job);
    else if (m.type === "worker") { state.workers.set(m.worker.name, m.worker); renderWorkers(); }
    else return;
    scheduleRender();
  };
}
let pending = false;
function scheduleRender() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }

async function refreshJobs() {
  try {
    const q = state.filter === "active" ? "?active=true&limit=500" : "?limit=500";
    (await api("/api/v1/jobs" + q)).jobs.forEach(upsert);
    (await api("/api/v1/workers")).workers.forEach(w => state.workers.set(w.name, w));
    renderWorkers(); render();
  } catch (err) { /* shown via the live indicator */ }
}

async function boot() {
  try {
    const h = await fetch("/api/v1/health").then(r => r.json());
    state.auth = h.auth;
    $("#keyBox").hidden = !h.auth; $("#userBox").hidden = h.auth;
    const wfs = await api("/api/v1/workflows");
    state.workflows = wfs.workflows;
    $("#wfSelect").innerHTML = state.workflows.map(w => `<option value="${esc(w.name)}">${esc(w.label)}</option>`).join("");
    $("#wfSelect").onchange = renderForm;
    renderForm();
    await refreshJobs();
    if (ws) { ws.onclose = null; ws.close(); }
    connect();
  } catch (err) {
    $("#form").innerHTML = `<div class="msg err" style="grid-column:1/-1">${esc(err.message)}${state.auth ? " — enter your API key (top right)." : ""}</div>`;
  }
}
setInterval(refreshJobs, 15000);   // keeps queue positions / ETAs fresh
setInterval(() => { if (visible().some(j => j.status === "running")) render(); }, 1000);
boot();
