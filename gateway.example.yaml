# The farm's gateway (decisions 0055, 0056): an agent that sends API definitions' jobs to
# outside providers, fal.ai first, and runs nothing on a GPU. It runs on the manager's
# machine, beside that machine's GPU agent, under its own name and with its own folders.
# Copy to gateway.yaml (git ignores it), edit, then run:
#
#   python -m comfyfarm agent --config gateway.yaml --check     (what it can and can't do)
#   python -m comfyfarm agent --config gateway.yaml
#
# Or keep it running: deploy/linux/farmctl.sh start gateway (install_cron.sh gateway).
#
# Until phase 11's step 5 it sends jobs only to a stand-in on this machine, which takes no
# money and sends nothing out. It answers where this file sends fal.ai's jobs, with its key:
#
#   deploy/linux/farmctl.sh start mock_fal      (python tools/mock_fal.py --gateway gateway.yaml)

name: wrk1125l-gateway           # as the dashboard shows it; unique on the farm
manager: http://127.0.0.1:8000   # the manager on this machine (its server.port), or its manager.json
token: ''                        # the manager's agents.token, if it has one

gateway:
  enabled: true
  account: peter-pilot           # whose accounts the keys are: kept with every run
  runs_dir: data/api_runs        # a folder per run (what was sent, the request's id); relative = next to this file
  poll_seconds: 2                # each job's status is asked this often
  default_minutes: 30            # the time limit of a definition without limits.max_minutes
  prices_hours: 24               # each provider's prices are read this often, for the manager's estimates
  providers:
    fal:                         # providers/fal.yaml
      lanes: 2                   # its jobs at once; empty: providers/fal.yaml's
      url: http://127.0.0.1:8189 # the stand-in (tools/mock_fal.py). Empty: fal.ai itself, from step 5
      media_seconds: 3600        # how long fal.ai keeps what is uploaded and what it makes
      # Each key in a file of its own, readable by this account alone (chmod 600): never in
      # git, the bank folder or this file. ~ is this account's home. The gateway reads them
      # when it starts, and sends them to fal.ai only. For the stand-in, make the key up.
      keys:
        requests: ~/.comfyfarm/fal_requests.key
        # A key with fal.ai's BILLING permissions: the gateway reads fal.ai's bill and balance
        # with it when the manager asks, for the ledger (decision 0061). Without it jobs still
        # run, and the ledger keeps its estimates. For the stand-in, make it up too.
        billing: ~/.comfyfarm/fal_billing.key

log_dir: logs                    # logs/agent-<name>.log; relative = next to this file

paths:
  # As agent.yaml's on this machine: inputs are read from show storage.
  mappings:
    - posix: /rdo/shows
      windows: //rodeofx.com/smb/shows

convert:
  # Never the GPU agent's scratch folder: an agent empties the scratch folders of jobs it
  # doesn't hold when it starts. EXRs are converted to PNG here before they're uploaded.
  scratch_dir: data/scratch-gateway
  max_parallel_jobs: 2
  tools: {oiiotool: '', ffmpeg: '', ffprobe: ''}   # as agent.yaml's on this machine
